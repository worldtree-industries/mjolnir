name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - name: Run lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Run tests
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        run: go build ./...

  check-go-floor:
    name: Toolchain consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert go.mod, ci.yml and README agree on the Go floor
        run: |
          set -euo pipefail
          floor=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)
          [ -n "$floor" ] || { echo "no go directive found in go.mod"; exit 1; }
          grep -q "Go ${floor} or later" README.md \
            || { echo "README.md must say 'Go ${floor} or later' (go.mod declares ${floor})"; exit 1; }
          for v in $(grep "go[-]version:" .github/workflows/ci.yml | grep -oE "[0-9.]+"); do
            oldest=$(printf '%s\n%s\n' "$v" "$floor" | sort -V | head -1)
            [ "$oldest" = "$floor" ] \
              || { echo "ci.yml go-version ${v} is below the go.mod floor ${floor}"; exit 1; }
          done
          echo "Go floor ${floor} consistent across go.mod, ci.yml and README"