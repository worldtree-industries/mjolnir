name: Release

on:
  # A push to main releases. workflow_dispatch runs the same decision without
  # publishing anything, because Tag is push-only: the release path can be
  # exercised before a real merge depends on it.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release half-way: a cancelled run could push a tag without the
# verify job that was meant to gate it having finished.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Install golangci-lint
        run: make install-lint
      - name: Verify
        run: make verify

  version-guard:
    name: Version guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Decide whether this push releases, and at which version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-plan.sh

  tag:
    name: Tag
    needs: [verify, version-guard]
    if: needs.version-guard.outputs.skip == '0' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Push the release tag
        env:
          TAG: ${{ needs.version-guard.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"
          echo "released ${TAG}"
